# What this package can be checked for without running a simulation.
#
# Reading and writing an MJCF model do not involve MuJoCo at all -- they are XML
# and arithmetic -- so that is what is under test here, and it is most of this
# package. Running a model is one call into MuJoCo's own loader and stepper.
#
# Nightly as well as on a push, because half of what is under test is written
# against PartCAD's sandbox contract -- `ocp_serialize`, `urdf_common`,
# `mass_properties`, `primitive_shapes` -- which lives in a package with a
# release cycle of its own. It is installed from PartCAD's `devel` branch
# rather than from PyPI: this package requires the PartCAD that resolves a
# part's mass and ships `mass_properties`, and a change on `devel` that moves
# the contract should fail here before it is released rather than in somebody's
# `pc info` after.
name: Test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The ends of what PartCAD supports. What happens in between is not a
        # different answer for code that is this close to the standard library.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          set -e
          python -m pip install --upgrade pip
          # `partcad` for the sandbox contract the reader and the writer are
          # written against, from `devel` -- see the header of this file.
          python -m pip install pytest pyyaml "partcad @ git+https://github.com/partcad/partcad@devel"
          # MuJoCo itself, so that the simulation and the snapshots it takes
          # run end to end rather than being skipped (`test_snapshot.py`). The
          # same range the plugin's `pythonRequirements` asks the sandbox for.
          python -m pip install "mujoco>=3.2,<4"

      - name: Run the tests
        run: pytest -v
